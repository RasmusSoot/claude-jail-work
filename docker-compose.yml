services:
  # LOGIN / MECHANISM jail: mounts only THIS repo. The only session that maps the OAuth callback
  # port 54545 (via the `jail-main` alias), so log in here once; every client jail shares the token
  # through the single-file .credentials.json mount below.
  claude:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      UPLOAD_DIR: ${UPLOAD_DIR:-/workspace/uploads}
      # Per-jail OTLP identity. NOTE: an employer-managed policy delivered through the login
      # (remote managed settings) may set OTEL_RESOURCE_ATTRIBUTES itself; the managed value wins.
      OTEL_RESOURCE_ATTRIBUTES: service.name=claude-code,role=jail,jail.name=${JAIL_NAME:-main}
    volumes:
      - .:/workspace
      - ${JAIL_HOME}/.claude-data:/home/node/.claude
      # Single-file overlay on top of the dir mount: on a file mountpoint the CLI's atomic rename
      # fails (EBUSY) and it falls back to an in-place write, so the host inode never changes and
      # every client jail (pinned to that inode by its own file mount) sees token refreshes.
      - ${JAIL_HOME}/.claude-data/.credentials.json:/home/node/.claude/.credentials.json
      - ${JAIL_HOME}/.claude-data.json:/home/node/.claude.json
      # Jail-only git identity; the host ~/.gitconfig is deliberately NOT mounted.
      - ${JAIL_HOME}/.claude-data.gitconfig:/home/node/.gitconfig
      # Shared Nix store: per-project devbox.json works identically in the jail and on the host.
      - /nix:/nix
    # No ports: here on purpose — aliases publish them, loopback only.
    stdin_open: true
    tty: true
    env_file:
      - .env

  # PER-CLIENT jail. One generic service; everything client-specific (repo mounts, state files,
  # tokens, kubeconfig material) is passed by tools/client-jail.sh via `docker compose run -v/-e`.
  # Never `docker compose run client` directly. Differences from `claude` on purpose:
  #   - no repo mount of this repo except tools/ (read-only): the upload server, init, kdev
  #   - per-client ~/.claude state; only the credentials file crosses over from the login jail
  #   - joins the client's kind Docker network so the API server is reachable by container name
  client:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.name=claude-code,role=jail,jail.name=${JAIL_NAME:-client}
    volumes:
      - ./tools:/workspace/tools:ro
      - ${JAIL_HOME}/.claude-data.gitconfig:/home/node/.gitconfig-base:ro
      - /nix:/nix
    networks: [default, kind]
    stdin_open: true
    tty: true

networks:
  kind:
    external: true
    name: ${KIND_NET:-kind}
