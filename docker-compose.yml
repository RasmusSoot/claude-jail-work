services:
  # LOGIN / MECHANISM jail: mounts only THIS repo. The only session that maps the OAuth callback
  # port 54545 (via the `jail-main` alias), so log in here once; every stack jail shares the token
  # through the single-file .credentials.json mount below.
  claude:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      TZ: ${TZ:-Europe/Tallinn}
      TERM: xterm-256color
      COLORTERM: truecolor
      UPLOAD_DIR: ${UPLOAD_DIR:-/workspace/uploads}
      # Per-jail OTLP identity. NOTE: an employer-managed policy delivered through the login
      # (remote managed settings) may set OTEL_RESOURCE_ATTRIBUTES itself; the managed value wins.
      OTEL_RESOURCE_ATTRIBUTES: service.name=claude-code,role=jail,jail.name=${JAIL_NAME:-main}
    volumes:
      - .:/workspace
      - ${JAIL_HOME}/.claude-data:/home/claude/.claude
      # Single-file overlay on top of the dir mount: on a file mountpoint the CLI's atomic rename
      # fails (EBUSY) and it falls back to an in-place write, so the host inode never changes and
      # every stack jail (pinned to that inode by its own file mount) sees token refreshes.
      - ${JAIL_HOME}/.claude-data/.credentials.json:/home/claude/.claude/.credentials.json
      - ${JAIL_HOME}/.claude-data.json:/home/claude/.claude.json
      # Jail-only git identity; the host ~/.gitconfig is deliberately NOT mounted.
      - ${JAIL_HOME}/.claude-data.gitconfig:/home/claude/.gitconfig
      # Jail-only Nix store (named volume, seeded from the image) — never the host's /nix.
      - jail-nix:/nix
    # No ports: here on purpose — aliases publish them, loopback only.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stdin_open: true
    tty: true
    env_file:
      - .env

  # PER-STACK jail. One generic service; everything stack-specific (repo mounts, state files,
  # tokens, kubeconfig material) is passed by tools/stack-jail.sh via `docker compose run -v/-e`.
  # Never `docker compose run stack` directly. Differences from `claude` on purpose:
  #   - no repo mount of this repo except tools/ (read-only): the upload server, init, kdev
  #   - per-stack ~/.claude state; only the credentials file crosses over from the login jail
  #   - no networks of its own: it joins the namespace of a pause container the launcher starts
  #     (per-stack bridge + kind network + published ports), shared with the git and dev proxy sidecars
  #   - no git token: the gitproxy sidecar below holds them and the jail's git is routed to it
  stack:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    working_dir: /workspace
    environment:
      TZ: ${TZ:-Europe/Tallinn}
      TERM: xterm-256color
      COLORTERM: truecolor
      OTEL_RESOURCE_ATTRIBUTES: service.name=claude-code,role=jail,jail.name=${JAIL_NAME:-stack},jail.reads=${JAIL_READS:-none}
    volumes:
      - ./tools:/workspace/tools:ro
      - ${JAIL_HOME}/.claude-data.gitconfig:/home/claude/.gitconfig-base:ro
      - jail-nix-stack:/nix               # one store PER STACK: a jail must not tamper with another client's tools
    network_mode: "container:${JAIL_NETNS:-launch-via-tools-stack-jail-sh}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stdin_open: true
    tty: true

  # GIT CREDENTIAL SIDECAR for a stack jail: tools/gitproxy/gitproxy.py, the same image with python3.
  # Started by tools/stack-jail.sh into the jail's network namespace, holding the GitHub/GitLab
  # tokens the jail no longer gets; the jail's git reaches it on 127.0.0.1:8002 via url.insteadOf.
  # Same posture as the dev proxy: read-only root, no capabilities, no networks of its own.
  gitproxy:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID}
        HOST_GID: ${HOST_GID}
    entrypoint: ["/usr/bin/tini", "-g", "--", "python3", "/workspace/tools/gitproxy/gitproxy.py"]
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./tools:/workspace/tools:ro
    network_mode: "container:${JAIL_NETNS:-launch-via-tools-stack-jail-sh}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  # Jail-only Nix stores, isolated from the host and from each other: one for the login jail, one per
  # stack (docker volume `jail-nix-<stack>`). `docker volume rm` one to reset it; the next start
  # re-seeds it from the image.
  jail-nix:
  jail-nix-stack:
    name: jail-nix-${STACK_NAME:-unset}

