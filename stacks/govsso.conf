# govsso — GovSSO (public upstream), worked on through a fork.
# This file is GENERIC by rule: repo names, the primary dir, the kind cluster and a host port.
# Every client FACT (UPSTREAM_OWNER, FORK_ORG, dev cluster, GitLab host, tokens) lives in ~/claude/jail/.env.govsso.
REPOS="govsso-lab GOVSSO-Session GovSSO-EndUserSelfService TARA-GovSSO-Admin TARA-GovSSO-InProxy TARA-GovSSO-ExampleClient TARA-Mock GovSSO-Test"
                                     # dirs under ~/claude/jail/govsso/; the clones: upstream fetch-only, origin = fork
                                     # = every image GOVSSO-Session's docker-compose.yml starts from a local build (session, enduserselfservice,
                                     # tara-admin, tara-govsso-inproxy, tara-govsso-exampleclient, tara-mock) + the tests; Ory Hydra is an upstream image
                                     # govsso-lab: local-only stack home (its CLAUDE.md explains the stack); no .git — mkdir it before tools/stack-fork.sh
PRIMARY=govsso-lab                     # the jail's cwd; its CLAUDE.md is what the session reads first
KIND_CLUSTER=govsso                    # `kind get clusters` name; created by tools/kind-stack.sh govsso up — not yet, fork first
KIND_NET=kind                        # docker network the kind nodes are on (shared by every stack for now; see docs/security.md Open)
REGISTRY_PORT=5004                   # the stack's registry (jail-govsso-registry:5000 on the kind network) published on host loopback
UPLOAD_PORT=8004                     # host loopback port for the upload UI
# BUILDER_IMAGE=paketobuildpacks/builder-noble-java-tiny:0.0.197   # build sidecar; set with BUILD_NAMES once the stack builds images
# BUILD_NAMES=""                     # image repos and chart names the sidecar may push
# ARGO_APPS=""                       # Argo CD Applications tools/kind-stack.sh govsso up creates, one per chart name
# KIND_NS=govsso KIND_SA=govsso-workbench  # defaults: namespace = stack, SA = <stack>-workbench; applied by tools/kind-stack.sh govsso up
# JAIL_ALLOW="Bash(git *), Read(*)"  # permission rules pinned into the jail's settings, comma-separated; default = everything per tool, "" = none
