# ai-governance — legal and governance questions around AI use, with a read-only view of other stacks.
# This file is GENERIC by rule; facts and tokens live in ~/claude/jail/.env.ai-governance.
REPOS="legal"                        # dirs under ~/claude/jail/ai-governance/
PRIMARY=legal                        # the jail's cwd
KIND_CLUSTER=ai-governance           # local kind cluster; namespace, SA and RoleBinding: tools/kind-stack.sh ai-governance up
KIND_NODE_IMAGE=kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5   # pinned: kind 0.32's default; read at create time only, a running cluster keeps its node
READS="siva"                         # other stacks mounted READ-ONLY under /reads/<stack>/<repo>
UPLOAD_PORT=8002                     # host loopback port for the upload UI
