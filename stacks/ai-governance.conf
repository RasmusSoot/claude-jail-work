# ai-governance — legal and governance questions around AI use, with a read-only view of other stacks.
# This file is GENERIC by rule: repo names, the primary dir, the kind cluster and host ports; one key order and
# one comment per key in every stacks/*.conf, so they diff against each other.
# Every client FACT (UPSTREAM_OWNER, FORK_ORG, dev cluster, GitLab host, tokens) lives in ~/claude/jail/.env.ai-governance.

# ── jail: tools/stack-jail.sh ──
REPOS="legal"                        # dirs under ~/claude/jail/ai-governance/; the clones: upstream fetch-only, origin = fork
PRIMARY=legal                        # the jail's cwd; its CLAUDE.md is what the session reads first
READS="siva"                         # other stacks' repo dirs mounted read-only under /reads/<stack>/<repo> (no tokens, no writes)
UPLOAD_PORT=8002                     # host loopback port for the upload UI (one stack's: the launcher refuses a clash)
# JAIL_ALLOW="Bash(git *), Read(*)"   # permission rules pinned into the jail's settings, comma-separated; default = everything per tool, "" = none

# ── kind: tools/kind-stack.sh ai-governance up ──
KIND_CLUSTER=ai-governance           # `kind get clusters` name; API reachable as ai-governance-control-plane:6443 on the kind network
KIND_NODE_IMAGE=kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5   # pinned: kind 0.32's default; read at create time only, a running cluster keeps its node
KIND_NET=kind                        # docker network the kind nodes are on (shared by every stack for now; see docs/security.md Open)
# REGISTRY_PORT=5002                 # the stack's registry (jail-ai-governance-registry:5000 on the kind network) published on host loopback
# KIND_HTTP_PORT=8080                # map the control-plane's :80 to host loopback for an ingress (read at create time)
# KIND_NS=ai-governance KIND_SA=ai-governance-workbench   # defaults: namespace = stack, SA = <stack>-workbench

# ── build sidecar: tools/build-image in the jail, tools/builder/ on the host ──
# BUILDER_IMAGE=paketobuildpacks/builder-noble-java-tiny:0.0.197   # build sidecar = this Paketo builder + helm (public image; tags move weekly, bump deliberately); set with BUILD_NAMES
# BUILD_NAMES=""                     # image repos and chart names the sidecar may push = the registry's push policy; what the lab's chart and build-image use
# BUILD_REGISTRY=jail-ai-governance-registry:5000   # default: this stack's registry as seen from the kind network

# ── deploy: Argo CD on the kind cluster ──
# ARGO_APPS=""                       # Argo CD Applications `up` creates: chart <name> from the stack registry, any version, values-kind.yaml from the chart if present
# KIND_ADDONS="kube-prometheus-stack"   # cluster add-ons from addons/<name>.yaml (this repo), host-installed into Argo project platform; needs ARGO_APPS
# ARGO_VERSION=v3.5.5 ARGO_NODEPORT=30443   # defaults: the Argo CD release installed; its API server's NodePort (the jail reaches it as ai-governance-control-plane:30443)
# ARGO_UI_PORT=8443 GRAFANA_UI_PORT=3000   # defaults: host loopback ports `kind-stack.sh ui` and `grafana` forward to
