# tara — TARA (public upstream), worked on through a fork.
# This file is GENERIC by rule: repo names, the primary dir, the kind cluster and a host port.
# Every client FACT (UPSTREAM_OWNER, FORK_ORG, dev cluster, GitLab host, tokens) lives in ~/claude/jail/.env.tara.
REPOS="tara-lab TARA-Login TARA-GovSSO-Admin TARA-GovSSO-InProxy TARA-Test"   # dirs under ~/claude/jail/tara/; the clones: upstream fetch-only, origin = fork
                                     # what starts TARA (TARA-Test's SUT): the login webapp, the admin service, the inproxy, plus Ory Hydra
                                     # as an upstream image; no upstream repo ships a compose for that set — tara-lab's job
                                     # tara-lab: local-only stack home (its CLAUDE.md explains the stack); no .git — mkdir it before tools/stack-fork.sh
PRIMARY=tara-lab                     # the jail's cwd; its CLAUDE.md is what the session reads first
KIND_CLUSTER=tara                    # `kind get clusters` name; created by tools/kind-stack.sh tara up — not yet, fork first
KIND_NODE_IMAGE=kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5   # pinned: kind 0.32's default; read at create time only, a running cluster keeps its node
KIND_NET=kind                        # docker network the kind nodes are on (shared by every stack for now; see docs/security.md Open)
REGISTRY_PORT=5003                   # the stack's registry (jail-tara-registry:5000 on the kind network) published on host loopback
UPLOAD_PORT=8003                     # host loopback port for the upload UI
# BUILDER_IMAGE=paketobuildpacks/builder-noble-java-tiny:0.0.197   # build sidecar; set with BUILD_NAMES once the stack builds images
# BUILD_NAMES=""                     # image repos and chart names the sidecar may push
# ARGO_APPS=""                       # Argo CD Applications tools/kind-stack.sh tara up creates, one per chart name
# KIND_NS=tara KIND_SA=tara-workbench  # defaults: namespace = stack, SA = <stack>-workbench; applied by tools/kind-stack.sh tara up
# JAIL_ALLOW="Bash(git *), Read(*)"  # permission rules pinned into the jail's settings, comma-separated; default = everything per tool, "" = none
