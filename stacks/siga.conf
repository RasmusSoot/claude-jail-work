# siga — SiGa (public upstream), worked on through a fork.
# This file is GENERIC by rule: repo names, the primary dir, the kind cluster and host ports; one key order and
# one comment per key in every stacks/*.conf, so they diff against each other.
# Every client FACT (UPSTREAM_OWNER, FORK_ORG, dev cluster, GitLab host, tokens) lives in ~/claude/jail/.env.siga.

# ── jail: tools/stack-jail.sh ──
REPOS="siga-lab SiGa SiGa-demo-application SiGa-Tests"   # dirs under ~/claude/jail/siga/; the clones: upstream fetch-only, origin = fork
                                     # = what SiGa's docker-compose.yaml builds locally (siga-webapp, siga-demo-application) + the tests; siga-admin-webapp
                                     # comes from a registry image there (no public source), SID-mock (Test-Government org) is an optional image
                                     # siga-lab: local-only stack home (its CLAUDE.md explains the stack); no .git — mkdir it before tools/stack-fork.sh, which passes over it
PRIMARY=siga-lab                     # the jail's cwd; its CLAUDE.md is what the session reads first
READS="siva"                         # other stacks' repo dirs mounted read-only under /reads/<stack>/<repo> (no tokens, no writes)
UPLOAD_PORT=8005                     # host loopback port for the upload UI (one stack's: the launcher refuses a clash)
# JAIL_ALLOW="Bash(git *), Read(*)"   # permission rules pinned into the jail's settings, comma-separated; default = everything per tool, "" = none

# ── kind: tools/kind-stack.sh siga up ──
KIND_CLUSTER=siga                    # `kind get clusters` name; API reachable as siga-control-plane:6443 on the kind network
KIND_NODE_IMAGE=kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5   # pinned: kind 0.32's default; read at create time only, a running cluster keeps its node
KIND_NET=kind                        # docker network the kind nodes are on (shared by every stack for now; see docs/security.md Open)
REGISTRY_PORT=5005                   # the stack's registry (jail-siga-registry:5000 on the kind network) published on host loopback
# KIND_HTTP_PORT=8080                # map the control-plane's :80 to host loopback for an ingress (read at create time)
# KIND_NS=siga KIND_SA=siga-workbench   # defaults: namespace = stack, SA = <stack>-workbench

# ── build sidecar: tools/build-image in the jail, tools/builder/ on the host ──
BUILDER_IMAGE=paketobuildpacks/builder-noble-java-tiny:0.0.197   # build sidecar = this Paketo builder + helm (public image; tags move weekly, bump deliberately); set with BUILD_NAMES
BUILD_NAMES="siga-webapp siga-demo-application"   # image repos and chart names the sidecar may push = the registry's push policy; what the lab's chart and build-image use
# BUILD_REGISTRY=jail-siga-registry:5000   # default: this stack's registry as seen from the kind network

# ── deploy: Argo CD on the kind cluster ──
ARGO_APPS="siga-webapp"              # Argo CD Applications `up` creates: chart <name> from the stack registry, any version, values-kind.yaml from the chart if present
# KIND_ADDONS="kube-prometheus-stack"   # cluster add-ons from addons/<name>.yaml (this repo), host-installed into Argo project platform; needs ARGO_APPS
# ARGO_VERSION=v3.5.5 ARGO_NODEPORT=30443   # defaults: the Argo CD release installed; its API server's NodePort (the jail reaches it as siga-control-plane:30443)
# ARGO_UI_PORT=8443 GRAFANA_UI_PORT=3000   # defaults: host loopback ports `kind-stack.sh ui` and `grafana` forward to
