# siva — SiVa (public upstream), worked on through a fork.
# This file is GENERIC by rule: repo names, the primary dir, the kind cluster and a host port.
# Every client FACT (dev cluster context/CIDR, GitLab host, tokens) lives in ~/claude/jail/.env.siva.
REPOS="siva-lab SiVa SiVa-demo-application SiVa-Test"   # dirs under ~/claude/jail/siva/; the SiVa* ones: upstream fetch-only, origin = fork
                                     # siva-lab: local-only stack home (its CLAUDE.md explains the stack); no .git, so stack-fork.sh passes over it
PRIMARY=siva-lab                     # the jail's cwd; its CLAUDE.md is what the session reads first
KIND_CLUSTER=siva                    # `kind get clusters` name; API reachable as siva-control-plane:6443. Lifecycle: tools/kind-stack.sh siva up
KIND_NODE_IMAGE=kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5   # pinned: kind 0.32's default; read at create time only, a running cluster keeps its node
KIND_NET=kind                        # docker network the kind nodes are on (per-stack nets later)
REGISTRY_PORT=5001                   # the stack's registry (jail-siva-registry:5000 on the kind network) published on host loopback
# KIND_HTTP_PORT=8080                # map the control-plane's :80 to host loopback for an ingress (kind-stack.sh, at create time)
UPLOAD_PORT=8001                     # host loopback port for the upload UI
BUILDER_IMAGE=paketobuildpacks/builder-noble-java-tiny:0.0.197   # build sidecar = this Paketo builder + helm (public image; tags move weekly, bump deliberately)
BUILD_NAMES="siva-webapp siva"       # image repos and chart names the sidecar may push; must match what the lab's chart and build-image use
# BUILD_REGISTRY=jail-siva-registry:5000  # default: this stack's registry (tools/kind-stack.sh) as seen from the kind network
ARGO_APPS="siva-webapp"              # Argo CD Applications tools/kind-stack.sh siva up creates: chart <name> from the stack registry, any version, values-kind.yaml from the chart if present
# ARGO_VERSION=v3.5.5 ARGO_NODEPORT=30443  # defaults: the Argo CD release installed; its API server's NodePort (the jail reaches it as siva-control-plane:30443)
# KIND_NS=siva KIND_SA=siva-workbench  # defaults: namespace = stack, SA = <stack>-workbench; applied by tools/kind-stack.sh siva up
# JAIL_ALLOW="Bash(git *), Read(*)"  # permission rules pinned into the jail's settings, comma-separated; default = everything per tool, "" = none
